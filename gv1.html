/* Tooltip */

.leaflet-tooltip {
	position: absolute;
	padding: 6px;

	}

}
.leaflet-tooltip-top {

}

.leaflet-tooltip-top:before {

<style>
:root{--ink:#1f2a1f;--muted:#5d6b5d;--card:#fff;--line:#e4e0d6;--accent:#2f6b3a;--accent-soft:#eaf2e7;
--water:#1f78c8;--eff:#8a5a2b;--pow:#e0a800;--tile:#d81b60;--pad:#ffe08a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#1f3d26}
#map{position:fixed;inset:0;background:#dfe9d6}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{position:fixed;z-index:1000;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px}
.search{flex:1;position:relative}
.search input{width:100%;border:0;border-radius:24px;padding:12px 16px 12px 40px;font:inherit;font-size:16px;box-shadow:0 2px 10px rgba(0,0,0,.2);outline:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:#777}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
.results button{display:flex;justify-content:space-between;width:100%;padding:11px 16px;text-align:left;border-bottom:1px solid #f0f0f0}
.results button span{color:var(--muted);font-size:13px}
.farm{background:var(--accent);color:#fff;border-radius:24px;padding:0 14px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:14px}
.fabs{position:fixed;z-index:1000;right:10px;transition:right .15s,bottom .2s;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;transition:bottom .2s}
.fab{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center}

const by = k => FARM.features.filter(f=>f.properties.layer===k);
const lineLen = cs => cs.slice(1).reduce((s,c,i)=>s+L.latLng(c[1],c[0]).distanceTo(L.latLng(cs[i][1],cs[i][0])),0);
const padSum = b => by('paddocks').filter(f=>f.properties.block===b).reduce((s,f)=>s+f.properties.ha,0).toFixed(2);
const gj = (k,opts) => { const l=L.geoJSON({type:'FeatureCollection',features:by(k)},opts); l._k=k; return l; };

/* ---------- layers ---------- */
let selected = null;
const padStyle = f => ({color:'#ffffff',weight:1.6,fillColor:'#9ccc65',fillOpacity:0.18});
const paddocks = gj('paddocks',{style:padStyle,onEachFeature:(f,l)=>{
  l.on('click',e=>{L.DomEvent.stopPropagation(e);selectPaddock(f.properties.num,false);});
}});
// ---- Pasture & fertiliser layers: per-paddock grass growth and N applied over a date range (MINDA data, signed-in staff only)
const pfGrow=L.layerGroup(), pfN=L.layerGroup(), pfGraze=L.layerGroup();
let MINDA=null, MINDA_AT='', pfLoading=false;
const PF={preset:'4w',from:'',to:''};
const pfYmd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function pfPreset(p){ const t=new Date(), y=t.getMonth()>=5?t.getFullYear():t.getFullYear()-1;   // season starts 1 June
  PF.preset=p; if(p==='4w'){ PF.from=pfYmd(new Date(t-28*864e5)); PF.to=pfYmd(t); } else if(p==='season'){ PF.from=y+'-06-01'; PF.to=pfYmd(t); }
  else if(p==='last'){ PF.from=(y-1)+'-06-01'; PF.to=y+'-05-31'; } }
pfPreset('4w');
const pfPad=k=>/^5\d\d$/.test(k)?String(+k.slice(1)):k;   // MINDA 501-597 = map paddock 1-97; 100-119 are the same
function pfCalc(){ const out={}, W=MINDA.walks, ds=Object.keys(W).filter(d=>d>=PF.from&&d<=PF.to).sort();
  for(let i=1;i<ds.length;i++){ const d0=ds[i-1], d1=ds[i], days=(new Date(d1)-new Date(d0))/864e5; if(days<3||days>35) continue;
    Object.keys(W[d1]).forEach(k=>{ if(!(k in W[d0])) return; const dl=W[d1][k]-W[d0][k]; if(dl<=0||dl/days>150) return;   // a drop = grazed in between; over 150/day = measuring noise
      const o=out[pfPad(k)]=out[pfPad(k)]||{g:0,gd:0,n:0,apps:[]}; o.g+=dl; o.gd+=days; }); }
  MINDA.fert.forEach(([d,prod,rate,N,pads])=>{ if(d<PF.from||d>PF.to||!N) return; const kg=rate*N/100;
    pads.forEach(k=>{ const o=out[pfPad(k)]=out[pfPad(k)]||{g:0,gd:0,n:0,apps:[]}; o.n+=kg; o.apps.push(d+' '+prod+' '+rate+' kg/ha'); }); });
  return { pads:out, walks:ds.length }; }
const pfCol=(v,max,c0,c1)=>{ const t=Math.max(0,Math.min(1,v/max)), h=x=>parseInt(x,16), a=[1,3,5].map(i=>h(c0.substr(i,2))), b=[1,3,5].map(i=>h(c1.substr(i,2)));
  return '#'+a.map((x,i)=>Math.round(x+(b[i]-x)*t).toString(16).padStart(2,'0')).join(''); };
const PFS={pfgrow:{max:80,c0:'#f1f8e9',c1:'#1b5e20',unit:'kg DM/ha/day',lab:'Grass grown'}, pfn:{max:150,c0:'#fff3e0',c1:'#bf360c',unit:'kg N/ha',lab:'N applied'}};
function pfDraw(){ if(!MINDA) return; const R=pfCalc();
  [['pfgrow',pfGrow],['pfn',pfN]].forEach(([id,grp])=>{ grp.clearLayers(); const S=PFS[id];
    grp.addLayer(L.geoJSON({type:'FeatureCollection',features:by('paddocks')},{style:f=>{ const o=R.pads[String(f.properties.num)], v=!o?null:id==='pfgrow'?(o.gd?o.g/o.gd:null):o.n;
        return v==null?{color:'#fff',weight:1,fillColor:'#9e9e9e',fillOpacity:.25,dashArray:'4 3'}:{color:'#fff',weight:1.2,fillColor:pfCol(v,S.max,S.c0,S.c1),fillOpacity:.78}; },
      onEachFeature:(f,l)=>{ const o=R.pads[String(f.properties.num)], v=!o?null:id==='pfgrow'?(o.gd?o.g/o.gd:null):o.n;
        l.bindTooltip(v==null?'–':String(Math.round(v)),{permanent:true,direction:'center',className:'pflab'});
        l.on('click',e=>{ L.DomEvent.stopPropagation(e); openSheet(`<h2>Paddock ${f.properties.num}</h2><div class="sub">${PF.from} to ${PF.to} · MINDA</div>
          <p><b>Grass grown:</b> ${o&&o.gd?Math.round(o.g/o.gd)+' kg DM/ha/day (over '+o.gd+' days of regrowth between walks)':'no regrowth measured in this period'}</p>
          <p><b>Nitrogen applied:</b> ${o&&o.n?Math.round(o.n)+' kg N/ha':'none recorded'}</p>${o&&o.apps.length?'<ul>'+o.apps.map(a=>'<li>'+a+'</li>').join('')+'</ul>':''}`); }); } })); });
  pfBox(R); }
function pfBox(R){ let b=document.getElementById('pfBox'); const on=['pfgrow','pfn','pfgraze'].filter(isOn);
  if(!on.length){ if(b) b.remove(); return; }
  if(!b){ b=document.createElement('div'); b.id='pfBox'; document.body.appendChild(b); }
  const leg=id=>{ const S=PFS[id]; return `<div class="pfleg"><span>${S.lab}</span><i style="background:linear-gradient(90deg,${S.c0},${S.c1})"></i><small>0 – ${S.max}+ ${S.unit}</small></div>`; };
  b.innerHTML=`<div class="pfh">Pasture &amp; fertiliser <button id="pfX" title="Turn these layers off">×</button></div>
    <div class="pfp">${[['4w','Last 4 weeks'],['season','Season to date'],['last','Last season']].map(([k,t])=>`<button data-p="${k}" class="${PF.preset===k?'on':''}">${t}</button>`).join('')}</div>
    <div class="pfd"><input type="date" id="pfFrom" value="${PF.from}"> to <input type="date" id="pfTo" value="${PF.to}"></div>
    ${on.includes('pfgrow')?leg('pfgrow'):''}${on.includes('pfn')?leg('pfn'):''}
    ${on.includes('pfgraze')?'<div class="pfnote">Paddocks grazed: this layer will read the grazing board once it is connected.</div>':''}
    <div class="pfnote">${MINDA?(R?R.walks+' farm walks in range · ':'')+'MINDA data to '+(Object.keys(MINDA.walks).sort().pop()||'')+' · grey = no data':pfLoading?'Loading…':''}</div>`;
  b.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{ pfPreset(x.dataset.p); pfDraw(); });
  b.querySelector('#pfFrom').onchange=e=>{ PF.preset=''; PF.from=e.target.value; pfDraw(); };
  b.querySelector('#pfTo').onchange=e=>{ PF.preset=''; PF.to=e.target.value; pfDraw(); };
  b.querySelector('#pfX').onclick=()=>{ ['pfgrow','pfn','pfgraze'].forEach(k=>state[k]=false); syncLayers(); };
}
function pfOn(){ if(MINDA){ pfDraw(); return; } pfBox();
  if(!STAFF.tok){ staffSignIn({why:'Grass growth and fertiliser layers are for Gladvale staff only.'}); ['pfgrow','pfn'].forEach(k=>state[k]=false); setTimeout(syncLayers,0); return; }
  if(pfLoading) return; pfLoading=true; pfBox();
  fetch(SUGGEST_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'minda',farm:META.name})}).then(r=>r.json())
    .then(r=>{ pfLoading=false; if(r.ok){ MINDA=r.data; pfDraw(); } else { toast(r.error||'Could not load the MINDA data'); pfBox(); } }).catch(()=>{ pfLoading=false; toast('No connection'); }); }
[pfGrow,pfN].forEach(g=>{ g.on('add',()=>setTimeout(pfOn,0)); g.on('remove',()=>setTimeout(()=>pfBox(),0)); });

const fiAlert = f => { const p=f.properties;

  return ''; };

(function(){ const fixed=['Suggestions','Paddocks'], groups=[]; let cur=null;
  LAYERS.forEach(d=>{ if(d.grp){ cur={g:d,items:[]}; groups.push(cur); } else cur.items.push(d); });
  groups.sort((a,b)=>((fixed.indexOf(a.g.grp)+1)||99)-((fixed.indexOf(b.g.grp)+1)||99) || a.g.grp.localeCompare(b.g.grp));
  const out=[]; groups.forEach(G=>{ out.push(G.g); G.items.sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true})); out.push(...G.items); });
  LAYERS.splice(0,LAYERS.length,...out); })();
const URLVIEW = new URLSearchParams(location.search).get('view') || '';
const HAZ = URLVIEW==='hazard';
const OFFICE = URLVIEW==='office';   // office wall screen: maintenance board docked on the left, refreshes every 10 minutes   // website "GV1 Interactive Hazard Map": paddocks + health & safety only, nothing else available
if(HAZ){ let g=null; const keep=LAYERS.filter(d=>{ if(d.grp) g=d.grp; return g==='Paddocks' || g==='Health & safety' || d.id==='sugg'; }); LAYERS.splice(0,LAYERS.length,...keep); }
{ const OFF=['Buildings & access','Dairy shed & barn services (2019 plan)','Effluent','Map notes','Winter management']; let g=null;
  LAYERS.forEach(d=>{ if(d.grp) g=d.grp; else if(OFF.includes(g)) d.on=false; }); }
const VIEW = new URLSearchParams(location.search).get('view') || '';
const STKEY = 'gvmap.layers.v2' + (VIEW ? '.'+VIEW : '');
let state = {};
try{ state = JSON.parse(localStorage.getItem(STKEY)||'{}'); }catch(e){}
const order = ['effarea','csa','lanes','creek','fencedww','buildings','yards','cowshed','pond','paddocks','pfgrow','pfn','pfgraze','wsupp','trees','tiles','maindrain','tilelabel','cables','airline','effdrain','power','effpipe',...Object.keys(WATER_COL).map(s=>'w'+s.replace(/\W/g,'')),'hydrant','trough','valve','gtap','bore','divined','effpit','septic','septicinfo','storm','inspect','bridge','camera','riparian','offal','houses','sbwashdown','sbeffpipe','sbdrain','sbtiles','wb0','wb1','wb2','wb3','wb4','wb5','wb6','hzarea','hzaddr','hzhaz','hzemerg','mapnote','farminfo','sghist','sugg'];
const MINZ = {trough:15, trees:15, riparian:14.5, valve:15.5, hydrant:15, gtap:16, effpit:16, inspect:16, storm:16, septic:16, septicinfo:16, offal:15, sghist:16, hzaddr:14.5, divined:15, camera:17};
if(URLVIEW==='water'){ delete MINZ.trough; delete MINZ.valve; }

order.splice(0,order.length,...order.filter(id=>LAYERS.some(d=>d.id===id)));
function syncLayers(){
  const z=map.getZoom();
  order.forEach(id=>{ const d=LAYERS.find(x=>x.id===id); const on = (id in state ? state[id] : d.on) && !(MINZ[id] && z<MINZ[id] && window._edId!==id);
    if(on){ if(!map.hasLayer(d.layer)) d.layer.addTo(map);} else map.removeLayer(d.layer); });
  order.forEach(id=>{ const d=LAYERS.find(x=>x.id===id); if(map.hasLayer(d.layer) && d.layer.bringToFront) d.layer.bringToFront(); });
  updateLabels();
  if(typeof renderKey==='function') renderKey();
}
function isOn(id){ const d=LAYERS.find(x=>x.id===id); if(!d) return false; return id in state ? state[id] : d.on; }
const GROUPS={}; { let g=null; LAYERS.forEach(d=>{ if(d.grp){ g=d.grp; GROUPS[g]=[]; } else if(g) GROUPS[g].push(d.id); }); }
function grpState(g){ const n=GROUPS[g].filter(isOn).length; return n===0?'':(n===GROUPS[g].length?'on':'some'); }
function setGroup(g,on){ GROUPS[g].forEach(id=>state[id]=on); try{localStorage.setItem(STKEY,JSON.stringify(state));}catch(e){} syncLayers(); }

function updateLabels(){
  const z=map.getZoom(); const show = isOn('paddocks') && z>=14.25;
  const mc=document.getElementById('map'); mc.classList.toggle('lbl-s', z<15.5); mc.classList.toggle('lbl-xs', z<15); mc.classList.toggle('z-lo', z<16); mc.classList.toggle('z-xlo', z<15);
  if(show && !map.hasLayer(padLabels)) padLabels.addTo(map);
  if(!show && map.hasLayer(padLabels)) map.removeLayer(padLabels);
  const tl = isOn('tilelabel') && z>=16.5;
  if(tl && !map.hasLayer(tileLabels)) tileLabels.addTo(map);
  if(!tl && map.hasLayer(tileLabels)) map.removeLayer(tileLabels);
  const nl = isOn('mapnote') && z>=15.5;
  if(nl && !map.hasLayer(noteLabels)) noteLabels.addTo(map);
  if(!nl && map.hasLayer(noteLabels)) map.removeLayer(noteLabels);
}
map.on('zoomend',syncLayers);

const sheet = document.getElementById('sheet'), body = document.getElementById('sheetBody'), fabs = document.getElementById('fabs');
function openSheet(html){ if(window.EDITING) return; body.innerHTML = html; sheet.classList.toggle('wide', html.indexOf('class="mb"')>=0); sheet.classList.add('open');
  requestAnimationFrame(()=>{ if(innerWidth<760){ const h=sheet.offsetHeight; fabs.style.visibility = h>innerHeight*0.45?'hidden':''; fabs.style.bottom=(h+14)+'px'; } }); }
function closeSheet(){ sheet.classList.remove('open'); fabs.style.bottom=''; fabs.style.visibility=''; clearSel(); try{ if(draw && drawbar.style.display==='none') drawEnd(); }catch(e){} }
document.getElementById('closeSheet').onclick = closeSheet;

function clearSel(){ if(selected){ paddocks.resetStyle(selected); selected=null; } }

let me = null, meMarker = null, watchId = null;
const fmtDist = m => m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(1)+' km';
const navLink = ll => `https://www.google.com/maps/dir/?api=1&destination=${ll.lat.toFixed(6)},${ll.lng.toFixed(6)}`;

function selectPaddock(num, zoom=true){
  clearSel();
  let lyr=null; paddocks.eachLayer(l=>{ if(l.feature.properties.num==num) lyr=l; });
  if(!lyr){ toast('No paddock '+num+' on '+META.name); return; }
  selected = lyr; lyr.setStyle({color:'#ff9800',weight:3.5,fillColor:'#ffe08a',fillOpacity:.55}); lyr.bringToFront();
  const p = lyr.feature.properties, c = lyr.getBounds().getCenter();
  if(zoom) map.fitBounds(lyr.getBounds(),{paddingBottomRight:[0,innerWidth<760?260:0],paddingTopLeft:[innerWidth<760?0:400,70],maxZoom:17});
  const where = me ? fmtDist(map.distance(me,c))+' from you' : (p.block==='McFarlane'?'McFarlane block':'GV1 milking platform');
  openSheet(`<h2>Paddock ${p.num}</h2><div class="sub">${p.block==='McFarlane'?'GV1 · McFarlane block':'GV1'} · ${where}</div>
  <div class="kv">
   <div>Effective area<b>${p.ha.toFixed(2)} ha</b></div>
   <div>Water troughs<b>${p.troughs}</b></div>
   <div>Water lines<b>${p.water.length?p.water.join(', '):'—'}</b></div>
   <div>Tile drains<b>${p.tiles?p.tiles+' line'+(p.tiles>1?'s':''):'None mapped'}</b></div>
   ${p.hydrants?`<div>Effluent hydrants<b>${p.hydrants}</b></div>`:''}
  </div>
  <div class="btns"><a class="btn" href="${navLink(c)}" target="_blank" rel="noopener">Directions</a><button class="btn alt" id="zoomPd">Zoom to paddock</button></div>`);
  document.getElementById('zoomPd').onclick=()=>map.fitBounds(lyr.getBounds(),{paddingBottomRight:[0,260],maxZoom:18});
}
function showPoint(k,f,ll){
  clearSel();
  const names={trough:'Water trough',valve:'Water valve / tap',hydrant:'Effluent hydrant'};
  const inPd = paddockAt(ll);
  openSheet(`<h2>${names[k]}</h2><div class="sub">${inPd?'Paddock '+inPd+' · ':''}${me?fmtDist(map.distance(me,ll))+' from you':ll.lat.toFixed(5)+', '+ll.lng.toFixed(5)}</div>
  ${f.properties.name?`<div class="kv"><div>Type<b>${f.properties.name}</b></div></div>`:''}
  <div class="btns"><a class="btn" href="${navLink(ll)}" target="_blank" rel="noopener">Directions</a></div>`);
}
function showLine(title,detail,ll){
  clearSel(); const inPd = paddockAt(ll);
  openSheet(`<h2>${title}</h2><div class="sub">${inPd?'Paddock '+inPd:''}</div><div class="kv"><div style="grid-column:1/-1">Detail<b>${detail}</b></div></div>`);
}
function paddockAt(ll){
  let hit=null; paddocks.eachLayer(l=>{ if(!hit && inside([ll.lng,ll.lat], l.feature.geometry.coordinates[0])) hit=l.feature.properties.num; }); return hit;
}
function inside(p,ring){ let x=p[0],y=p[1],ins=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
  if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins;} return ins; }

function lvStart(panel){
  const L=camList(), G=gridFids(), tok=nxTok(); if(!tok) return;
  panel.querySelectorAll('img[data-lv]').forEach(img=>{ const i=+img.dataset.lv, f=L.find(x=>x.properties.fid===G[i]), id=f&&camId(f), st=document.getElementById('lvst'+i); if(!id) return;
    const snap=()=>{ if(!img.isConnected) return clearInterval(img._t);
      fetch(NX_RELAY+'/rest/v2/devices/'+id+'/image?height=480',{headers:{Authorization:'Bearer '+tok.t}}).then(r=>{ if(r.status===401){ clearInterval(img._t); if(st) st.textContent='Nx sign-in expired – sign in again'; nxClear(); throw 0; } if(!r.ok) throw 0; return r.blob(); })
        .then(b=>{ const u=URL.createObjectURL(b); const old=img.src; img.src=u; if(old.startsWith('blob:')) URL.revokeObjectURL(old); if(st) st.textContent='snapshot · updates every 2 s'; }).catch(()=>{}); };
    img.onload=()=>{ img.classList.add('ok'); if(st&&!img.src.startsWith('blob:')) st.textContent=''; };
    img.onerror=()=>{ if(img._snap) return; img._snap=1; if(st) st.textContent='switching to snapshots…'; snap(); img._t=setInterval(snap,2000); };
    img.src=NX_RELAY+'/media/'+id+'.mpjpeg?resolution=480p&_token='+encodeURIComponent(tok.t);
    // zoom (scroll) and pan (drag) inside the picture
    let z=1,ox=0,oy=0,drag=null; const ap=()=>img.style.transform=`translate(${ox}px,${oy}px) scale(${z})`;
    img.parentNode.addEventListener('wheel',e=>{ e.preventDefault(); z=Math.max(1,Math.min(6,z*(e.deltaY<0?1.2:1/1.2))); if(z===1){ox=oy=0;} ap(); },{passive:false});
    img.addEventListener('mousedown',e=>{ if(z>1){ drag=[e.clientX-ox,e.clientY-oy]; e.preventDefault(); } });
    addEventListener('mousemove',e=>{ if(drag){ ox=e.clientX-drag[0]; oy=e.clientY-drag[1]; ap(); img._moved=1; } });
    addEventListener('mouseup',()=>{ drag=null; setTimeout(()=>img._moved=0,0); });
    img.onclick=()=>{ if(img._moved) return; lvBig=lvBig===i?-1:i; officeRender(); };
  });
}

  const nf=document.getElementById('nxF'); if(nf) nf.onsubmit=e=>{ e.preventDefault(); const err=document.getElementById('nxErr'), btn=nf.querySelector('button'); btn.disabled=true; err.textContent='Signing in…';
    const body={grant_type:'password',username:nf.u.value.trim(),password:nf.p.value}; if(nf.c.value.trim()) body.totp=nf.c.value.trim();
    nxToken(body).then(({ok,j})=>{ if(ok&&j.access_token){ nxStore(j,nf.k.checked); nf.reset(); officeRender(); }
      else { btn.disabled=false; err.textContent=/totp|second|2fa|mfa/i.test(JSON.stringify(j))?'Nx asked for your 2-step code – enter it and try again.':'Nx Cloud did not accept that sign-in ('+(j.errorText||j.error||'error')+').'; } })
     .catch(()=>{ btn.disabled=false; err.textContent='Could not reach Nx Cloud.'; }); };
  const go=document.getElementById('ctGo'); if(go) go.onclick=()=>{ const sec=+document.getElementById('ctSec').value; try{ localStorage.setItem('gvmap.tour',sec); }catch(e){}
    const S=show(); if(!S.length) return; let k=0; camShow(S[0]); camTourN=sec;
    camTour=setInterval(()=>{ camTourN--; const n=document.getElementById('ctN'); if(n) n.textContent=camTourN;
      if(camTourN<=0){ if(!camWin||camWin.closed){ camTourStop(); return; } k=(k+1)%S.length; camIdx=L.indexOf(S[k]); camTourN=sec; camBox();
        try{ camWin.location.href=S[k].properties.nx||LINKS.nx; }catch(e){} } },1000);
    officeRender(); };
  const st=document.getElementById('ctStop'); if(st) st.onclick=()=>camTourStop();
  // refresh an expiring token in the background (if Nx gave us a refresh token)
  const tk=nxTok(); if(tk&&tk.r&&tk.exp&&tk.exp-Date.now()<15*60000) nxToken({grant_type:'refresh_token',refresh_token:tk.r}).then(({ok,j})=>{ if(ok&&j.access_token) nxStore(j,tk.keep); }).catch(()=>{});
  lvStart(panel);
}

const MT_START='2026-11-09', MT_TARGET=95;
const MT=[  // id, task, freq D/W/M/A, how: photo | done | auto, tab (for auto), months (seasonal)
 ['grazing','Photo of the pasture grazing board','D','photo'],
 ['jobs','Photo of jobs to do / roster','D','photo'],
 ['fertmap','Photo of the fertiliser maps','D','photo'],
 ['effck','Effluent daily checklist (or "system not run today")','D','auto','ck'],
 ['roster','Photo of the roster','W','photo'],
 ['feedbudget','Photo of the feed budget board','W','photo'],
 ['wedges','Photo of completed feed wedges incl. growth rates','W','photo'],
 ['ph_ponds','Photo of effluent pond levels','W','photo'],
 ['ph_sand','Photo of sand traps','W','photo'],
 ['ph_solids','Photo of solids ponds / storage areas','W','photo'],
 ['effboard','Effluent application board up to date','W','auto','eb'],
 ['fertdone','Photo of completed fertiliser map for the week','W','photo'],
 ['workboard','Photo of the paddock workboard (Nov–Dec)','W','photo',null,[11,12]],
 ['trev','Trev reports completed (Tue expected, Thu final)','W','done'],
 ['wsr','Weekly Summary Report downloaded (PDF) & circulated','W','done'],
 ['monthend','Trev Month End Report downloaded & circulated','M','done'],
 ['hs','Health & Safety meeting','M','done'],
 ['leak','Check effluent pond leak detection system (photo)','M','auto','ck'],
 ['quiz','Effluent training quiz (all dairy staff)','M','done'],
 ['hygiene','Monthly hygiene check of dairy shed','M','done'],
 ['cams','Clean security cameras','M','done'],
 ['asd','ASD uploaded for stock movements','A','done']];
const MTF={D:'Daily',W:'Weekly',M:'Monthly',A:'As required'};
const ymdL=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00:00');
const monKey=s=>{ const d=pd(s), w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymdL(d); };
const perKey=(f,s)=>f==='D'?s:f==='W'?monKey(s):s.slice(0,7);
const mtDone=id=>(((ENV&&ENV.tasks&&ENV.tasks.done)||{})[id])||[];
const mtDoneSet=t=>new Set(mtDone(t[0]).map(s=>perKey(t[2],s)));
function mtNow(t){ const today=ymdL(new Date()); return mtDoneSet(t).has(perKey(t[2],today)); }
function mtMonth(y,m){   // compliance for one calendar month (m 1-12)
  const today=ymdL(new Date()), first=ymdL(new Date(y,m-1,1)), last=ymdL(new Date(y,m,0)); let due=0, done=0; const per={};
  if(last<MT_START||first>today) return null;
  MT.forEach(t=>{ if(t[2]==='A'||(t[5]&&t[5].indexOf(m)<0)) return; const ds=mtDoneSet(t), keys=[];
    if(t[2]==='D'){ for(let d=pd(first>MT_START?first:MT_START); ymdL(d)<=last&&ymdL(d)<=today; d.setDate(d.getDate()+1)) keys.push([ymdL(d),ymdL(d)<today]); }
    else if(t[2]==='W'){ for(let d=pd(first); ymdL(d)<=last; d.setDate(d.getDate()+1)) if(d.getDay()===0){ const sun=ymdL(d); if(sun>=MT_START&&monKey(sun)<=today) keys.push([monKey(sun),sun<today]); } }
    else keys.push([first.slice(0,7),last<today]);
    let a=0,b=0; keys.forEach(([k,ended])=>{ const ok=ds.has(k); if(ended||ok){ b++; if(ok) a++; } }); due+=b; done+=a; per[t[0]]=[a,b]; });
  return {due,done,pct:due?Math.round(done/due*100):null,per};
}
const pctCls=p=>p==null?'':p>=MT_TARGET?'ok':p>=85?'wrn':'bad';
function mtStatus(t){ const today=ymdL(new Date()), now=new Date();
  if(t[2]==='A') return ['','as required'];
  if(mtNow(t)) return ['ok','✓ done '+(t[2]==='D'?'today':t[2]==='W'?'this week':'this month')];
  if(t[2]==='D') return ['bad','due today'];
  if(t[2]==='W'){ const left=(7-now.getDay())%7; return [left<=1?'bad':'wrn',left===0?'due today (Sunday)':`due by Sunday (${left} day${left===1?'':'s'})`]; }
  const left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate(); return [left<=3?'bad':left<=7?'wrn':'',`due by month end (${left} days)`];
}
function mtOutstanding(){ const now=new Date(), left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate();
  return MT.filter(t=>t[2]!=='A'&&!(t[5]&&t[5].indexOf(now.getMonth()+1)<0)&&!mtNow(t)&&(t[2]!=='M'||left<=7)&&t[0]!=='effck'); }
function mtBtn(t){
  if(t[3]==='auto') return t[0]==='effck'?`<button class="btn alt mtb" data-tab="ck">Checklist</button><button class="btn alt mtb" data-mtnr="1">Not run today</button>`

  return t[3]==='photo'?`<label class="btn mtb">📷 Photo<input type="file" accept="image/*" capture="environment" data-mtph="${t[0]}" hidden></label>`
                       :`<button class="btn mtb" data-mt="${t[0]}">✓ Done</button><label class="btn alt mtb" title="Add a photo">📷<input type="file" accept="image/*" capture="environment" data-mtph="${t[0]}" hidden></label>`;
}

     <div class="mthist">${hist.length?hist.map(h=>`<div><small>${h[0]}</small><b class="${pctCls(h[1])}">${h[1]}%</b></div>`).join(''):'<small>Monthly history builds up from here – scoring started '+dshort(MT_START)+'.</small>'}</div></div>
   <div style="display:flex;gap:8px;align-items:center;margin:8px 0"><b style="font-size:12px;color:#5b6b55">RECORDING AS</b>${signerSel('mtName')}<input id="mtOther" placeholder="Your name" maxlength="80" style="display:none;flex:1"></div>
   <p class="note" style="margin:0 0 6px">A daily job counts once the day is over, a weekly job once Sunday has passed, a monthly job at month end. Doing a job late in its day/week/month still counts; skipping it lowers the score.</p>
   ${['D','W','M','A'].map(f=>`<table class="mtt"><tr><th>${MTF[f]}</th><th>This ${f==='D'?'day':f==='W'?'week':f==='M'?'month':'–'}</th><th>Last done</th><th>Month</th><th></th></tr>${MT.filter(t=>t[2]===f).map(row).join('')}</table>`).join('')}
   <p class="note">Every job is recorded on the "Management tasks log" tab of the GV1 Farm Management sheet (photos in the Farm task photos folder).</p></div>`;
}

function calcVals(c){ const n=k=>{ const x=parseFloat(c[k]); return isNaN(x)?null:x; }, A=n('rate'), B=n('maxdepth'), D=n('lines'), F=n('pond'), G=n('podrate')??A, H=n('pods'), K=n('avghrs');

  const f0=leaves(edLayerObj(ed.d))[0], gt=f0?f0.feature.geometry.type:(ed.key==='trough'||ed.key==='bore'?'Point':'LineString');
  const shape = gt==='Point'?'Marker':gt==='Polygon'?'Polygon':'Line'; ed.mode='draw'; edModes();
  map.pm.enableDraw(shape,{continueDrawing:false, finishOn: shape==='Marker'?null:'dblclick'}); toast(shape==='Marker'?'Tap where it goes':'Tap points, tap the last point again (or double-tap) to finish'); };
map.on('pm:create', e=>{ if(!ed||!ed.d) return; const l=e.layer; map.removeLayer(l);
  const fid='new-'+Date.now(), props={layer:ed.key, fid, ...(edLayerObj(ed.d)._props||{}), ...(ed.key==='wsupp'?{dir:1}:{})};
  l.feature={type:'Feature',properties:props,geometry:l.toGeoJSON().geometry}; l.feature._new=true;
  if(l.setStyle && ed.d.layer.options && ed.d.layer.options.style) l.setStyle(typeof ed.d.layer.options.style==='function'?ed.d.layer.options.style(l.feature):ed.d.layer.options.style);
  edLayerObj(ed.d).addLayer(l); ed.changes[fid]={action:'add', l}; edCount(); ed.mode=''; edModes(); edPick(ed.d.id); document.getElementById('edLayer').value=ed.d.id; });
document.getElementById('edDel').onclick=()=>{ if(!ed||!ed.d) return toast('Choose a layer first'); map.pm.disableDraw();
  if(ed.mode==='del'){ map.pm.disableGlobalRemovalMode(); ed.mode=''; edModes(); return; }
  ed.mode='del'; edModes(); map.pm.enableGlobalRemovalMode(); toast('Tap a line or point to delete it'); };
map.on('pm:remove', e=>{ if(!ed) return; const f=e.layer.feature; if(!f||!f.properties.fid) return;
  if(f._new) delete ed.changes[f.properties.fid]; else ed.changes[f.properties.fid]={action:'delete', l:e.layer}; edCount(); });
document.getElementById('edRev').onclick=()=>{ if(!ed||!ed.d) return; map.pm.disableDraw(); map.pm.disableGlobalRemovalMode(); ed.mode = ed.mode==='rev'?'':'rev'; edModes(); if(ed.mode) toast('Tap a row to flip its grazing direction'); };
document.getElementById('edUndo').onclick=()=>{ if(!ed) return; if(Object.keys(ed.changes).length && !confirm('Discard unsaved changes?')) return; location.reload(); };
document.getElementById('edDone').onclick=()=>{ if(!ed) return; if(Object.keys(ed.changes).length && !confirm('You have unsaved changes – close without saving?')) return; location.reload(); };
document.getElementById('edSave').onclick=()=>{ if(!ed) return; const list=Object.entries(ed.changes).map(([fid,c])=>{ const f=c.l.feature;
    const o={fid, layer:f.properties.layer||ed.key, action:c.action}; if(c.action!=='delete'){ o.geom=c.l.toGeoJSON().geometry; }
    if(c.action==='add'){ const p={...f.properties}; delete p.layer; delete p.fid; o.props=p; } return o; });
  if(!list.length) return toast('No changes to save');
  const b=document.getElementById('edSave'); b.disabled=true; b.textContent='Saving…';
  fetch(SUGGEST_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'edits',pin:ed.pin,farm:META.name,edits:list})}).then(r=>r.json())
    .then(r=>{ if(!r.ok){ toast(r.error||'Could not save'); b.disabled=false; edCount(); return; }
      try{ const cur=JSON.parse(localStorage.getItem('gvmap.edits.GV1')||'[]'); localStorage.setItem('gvmap.edits.GV1',JSON.stringify(cur.concat(list))); }catch(e){}
      Object.values(ed.changes).forEach(c=>{ if(c.l&&c.l.feature) c.l.feature._new=false; }); applyEdits(list); ed.changes={}; b.disabled=false; edCount(); fiDraw();
      toast('Saved – keep editing, pick another layer, or press Close when you\'re done'); })
    .catch(()=>{ toast('Could not save – check your signal'); b.disabled=false; edCount(); }); };
/* fetch the latest edits; if they've changed since this device last looked, reload once to show them */
if(/^https:/.test(SUGGEST_URL)) fetch(SUGGEST_URL+'?edits=1&farm='+encodeURIComponent(META.name)).then(r=>r.json()).then(list=>{
  if(!Array.isArray(list)) return; const s=JSON.stringify(list.map(e=>({fid:e.fid,layer:e.layer,action:e.action,geom:e.geom,props:e.props})));
  const c=JSON.stringify(JSON.parse(EDITS_CACHE).map(e=>({fid:e.fid,layer:e.layer,action:e.action,geom:e.geom,props:e.props})));
  if(s!==c){ let ok=false; try{ localStorage.setItem('gvmap.edits.GV1',s); ok=localStorage.getItem('gvmap.edits.GV1')===s; }catch(e){} if(ok && !window.EDITING) location.reload(); } }).catch(()=>{});

/* ---------- map views (ready-made layer sets) ---------- */
const WL = () => LAYERS.filter(d=>d.id && /^w(\d|Wash)/.test(d.id)).map(d=>d.id);
const VIEWS = [
  {k:'everyday', n:'Everyday', d:'Paddocks, troughs, lanes, suggestions', ids:()=>['paddocks','trough','lanes','buildings','creek']},
  {k:'water', n:'Stock water', d:'Water lines, troughs, valves, bores, taps', ids:()=>['paddocks','trough','valve','bore','gtap','divined',...WL()]},
  {k:'blocks', n:'Water blocks', d:'The 7 stock water blocks', ids:()=>['paddocks','trough','wb0','wb1','wb2','wb3','wb4','wb5','wb6']},
  {k:'drain', n:'Drainage', d:'Tile drains, main drain, creeks, culverts', ids:()=>['paddocks','tiles','maindrain','tilelabel','inspect','creek','bridge','storm','sbtiles']},
  {k:'eff', n:'Effluent', d:'Pipes, hydrants, irrigation area, ponds', ids:()=>['paddocks','effpipe','hydrant','effarea','pond','effdrain','effpit','airline','septic','septicinfo']},
  {k:'env', n:'Riparian & environment', d:'Plantings, trees, waterways, CSAs', ids:()=>['paddocks','riparian','trees','fencedww','csa','creek','offal']},
  {k:'hs', n:'Health & safety', d:'Hazards, first aid, assembly point, power', ids:()=>['paddocks','hzhaz','hzemerg','hzarea','hzaddr','power','cables','lanes','buildings','pond']},
  {k:'shed', n:'Dairy shed', d:'Shed & barn services, levels, cameras', ids:()=>['sbwashdown','sbeffpipe','sbdrain','sbtiles','cables','pond','buildings','cowshed','yards','lanes','farminfo','effpit','effdrain','valve','hzhaz','hzemerg','camera']},
  {k:'winter', n:'Winter', d:'Winter grazing & supplements', ids:()=>['paddocks','wsupp','creek','trough','lanes']},
  {k:'sugg', n:'Suggestions', d:'Just the staff suggestions (open & closed)', ids:()=>['paddocks']},
  {k:'clear', n:'Paddocks only', d:'Start from a clean map', ids:()=>['paddocks'], nosugg:true},
  {k:'all', n:'All layers', d:'Everything on – very busy!', ids:()=>LAYERS.filter(d=>d.id).map(d=>d.id)}];
let curView=''; try{ curView=localStorage.getItem('gvmap.view')||''; }catch(e){}
function applyView(v){ LAYERS.forEach(d=>{ if(d.id) state[d.id]=false; }); [...v.ids(),...(v.nosugg?[]:['sugg','sghist'])].forEach(k=>state[k]=true);
  curView=v.k; try{ localStorage.setItem(STKEY,JSON.stringify(state)); localStorage.setItem('gvmap.view',v.k); }catch(e){}
  syncLayers(); body.querySelectorAll('.views button').forEach(b=>b.classList.toggle('on',b.dataset.v===v.k));
  if(v.k==='shed') map.fitBounds([[-46.17135,168.13400],[-46.16790,168.13560]],{paddingTopLeft:[innerWidth>=760?280:10,70],paddingBottomRight:[70,10]}); else fitFarm();
}
document.getElementById('viewsBtn').onclick=()=>{ clearSel();
  openSheet(`<h2>Map views</h2><div class="sub">Tap a view to show just the layers for that job – this box stays open so you can flick between them.</div>
   <div class="views">${VIEWS.map(v=>`<button data-v="${v.k}" class="${v.k===curView?'on':''}"><b>${v.n}</b><small>${v.d}</small></button>`).join('')}</div>`);
  body.querySelectorAll('.views button[data-v]').forEach(b=>b.onclick=()=>applyView(VIEWS.find(v=>v.k===b.dataset.v)));
  const ob=body.querySelector('.views button[data-office]'); if(ob) ob.onclick=()=>{ location.href='?view=office'; }; };

/* ---------- measuring tool ---------- */
let meas=null; const measbar=document.getElementById('measbar');
const fmtM = m => m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(2)+' km';
function measUpdate(){ if(!meas) return; meas.tmp.clearLayers(); const p=meas.pts; let d=0;
  for(let i=1;i<p.length;i++){ const s=map.distance(p[i-1],p[i]); d+=s;
    if(p.length>2||i===1) meas.tmp.addLayer(L.marker([(p[i-1].lat+p[i].lat)/2,(p[i-1].lng+p[i].lng)/2],{interactive:false,icon:L.divIcon({className:'',html:`<span class="mlbl">${fmtM(s)}</span>`,iconSize:null})})); }
  if(p.length>1) meas.tmp.addLayer(L.polyline(p,{color:'#ff1744',weight:3,interactive:false}));
  let a=''; if(p.length>2){ const R=6378137, lat0=p[0].lat*Math.PI/180; let s=0;
    const xy=p.map(q=>[q.lng*Math.PI/180*R*Math.cos(lat0), q.lat*Math.PI/180*R]);
    for(let i=0;i<xy.length;i++){ const j=(i+1)%xy.length; s+=xy[i][0]*xy[j][1]-xy[j][0]*xy[i][1]; }
    const ha=Math.abs(s)/2/10000; a='Area '+(ha<1?Math.round(ha*10000)+' m²':ha.toFixed(2)+' ha');
    meas.tmp.addLayer(L.polygon(p,{color:'#ff1744',weight:0,fillOpacity:.12,interactive:false})); }
  p.forEach(q=>meas.tmp.addLayer(L.circleMarker(q,{radius:5,color:'#fff',weight:2,fillColor:'#ff1744',fillOpacity:1,interactive:false})));
  document.getElementById('measD').textContent=fmtM(d); document.getElementById('measA').textContent=a; }
function measStart(){ closeSheet(); try{ history.pushState({gvmeas:1},''); }catch(e){} meas={pts:[],tmp:L.layerGroup().addTo(map)}; measbar.style.display='block'; fabs.style.display='none'; measUpdate(); }
function measEnd(){ if(meas){ map.removeLayer(meas.tmp); meas=null; } measbar.style.display='none'; fabs.style.display=''; }
document.getElementById('measBtn').onclick=measStart;
document.getElementById('measClose').onclick=measEnd;
document.getElementById('measClear').onclick=()=>{ meas.pts=[]; measUpdate(); };
document.getElementById('measUndo').onclick=()=>{ meas.pts.pop(); measUpdate(); };
(function(){ const c=map.getContainer(); let down=null;
  c.addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY]; },true);
  c.addEventListener('click',e=>{ if(!meas) return; e.stopPropagation(); e.preventDefault();
    if(down && Math.hypot(e.clientX-down[0],e.clientY-down[1])>8) return;
    meas.pts.push(map.mouseEventToLatLng(e)); measUpdate(); },true); })();

/* ---------- map key (legend) ---------- */
const keyBox=document.getElementById('keyBox'), keyBtn=document.getElementById('keyBtn');
const keyExp={};
function renderKey(){
  if(!keyBox.classList.contains('open')) return;
  let h='<h3>Key <button id="keyClose" aria-label="Close key">×</button></h3>', grp=null, fixed=false;
  if(!HAZ) h+=STAFF.tok?`<div class="staffrow">🔓 Signed in as <b>${escH(STAFF.name)}</b> <button id="staffOutBtn">Sign out</button></div>`:`<div class="staffrow"><button id="staffInBtn">🔒 Staff sign in</button> <span>to see all tasks &amp; photos</span></div>`;
  LAYERS.forEach(d=>{
    if(d.grp){ grp=d.grp; fixed=['Suggestions','Paddocks'].includes(grp);
      if(!(grp in keyExp)) keyExp[grp]=!!grpState(grp);
      if(!fixed) h+=`<div class="kg ${grpState(grp)}"><button class="kc" data-g="${grp}" title="Show / hide the list"><span class="car">${keyExp[grp]?'▾':'▸'}</span><span class="l">${grp}</span></button><button class="ks" data-g="${grp}" title="Turn the whole group on/off"><span class="tg"></span></button></div>`;
      return; }
    if(!fixed && !keyExp[grp]) return;
    const on=isOn(d.id);
    h+=`<button class="row ${on?'':'off'}" data-id="${d.id}" title="Tap to turn on/off"><span class="sw">${d.sw}</span><span class="nm">${d.name}</span><span class="ck">${on?'✓':''}</span></button>`;
  });
  h+='<div class="hint">Group switch = all on/off. Tap ▸ to open a group, then tap any line to turn just that one on or off.</div>';
  keyBox.innerHTML=h; requestAnimationFrame(placeFabs);
  document.getElementById('keyClose').onclick=()=>toggleKey(false);
  { const i=document.getElementById('staffInBtn'), o=document.getElementById('staffOutBtn'); if(i) i.onclick=()=>staffSignIn(); if(o) o.onclick=()=>{ staffOut(); location.reload(); }; }
  keyBox.querySelectorAll('.kc').forEach(b=>b.onclick=()=>{ keyExp[b.dataset.g]=!keyExp[b.dataset.g]; renderKey(); });
  keyBox.querySelectorAll('.ks').forEach(b=>b.onclick=()=>{ const g=b.dataset.g, on=!grpState(g); keyExp[g]=true; setGroup(g, on); });
  keyBox.querySelectorAll('.row').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; state[id]=!isOn(id); try{localStorage.setItem(STKEY,JSON.stringify(state));}catch(e){} syncLayers(); });
}
function placeFabs(){}
function toggleKey(on){ keyBox.classList.toggle('open',on); keyBtn.classList.toggle('on',on); try{localStorage.setItem('gvmap.key',on?'1':'0');}catch(e){} renderKey(); placeFabs(); }
keyBtn.onclick=()=>toggleKey(!keyBox.classList.contains('open'));

/* ---------- start ---------- */
const farmBounds = paddocks.getBounds();
function fitFarm(){ map.fitBounds(farmBounds,{padding:[20,20],paddingTopLeft:[20,70]}); updateLabels(); }
document.getElementById('fitBtn').onclick=()=>{ closeSheet(); fitFarm(); };
{ const ob=document.getElementById('officeBtn'); if(OFFICE){ ob.dataset.label='Map view'; ob.title='Leave the office view'; }
  ob.onclick=()=>{ location.href=location.pathname+(OFFICE?'':'?view=office'); }; }
document.getElementById('listBtn').onclick=()=>{ clearSel();
  const ps=by('paddocks').map(f=>f.properties).sort((a,b)=>a.num-b.num);
  const row=p=>`<button class="lyr" data-n="${p.num}" style="padding:7px 0"><span class="nm">Paddock ${p.num}${p.block==='McFarlane'?' <span class="cnt" style="display:inline">· McFarlane</span>':''}</span><b>${p.ha.toFixed(2)} ha</b></button>`;
  openSheet(`<h2>Paddock sizes</h2><div class="sub">${ps.length} paddocks · GV1 ${padSum('GV1')} ha · McFarlane ${padSum('McFarlane')} ha · total ${(+padSum('GV1')+ +padSum('McFarlane')).toFixed(2)} ha effective</div>${ps.map(row).join('')}`);
  body.querySelectorAll('.lyr[data-n]').forEach(b=>b.onclick=()=>selectPaddock(+b.dataset.n)); };
if(VIEW==='shed'){   // link from the website: dairy shed, wintering barn, feed pad & effluent ponds, shed services only
  if(!Object.keys(state).length){ LAYERS.forEach(d=>{ if(d.id) state[d.id]=false; });
    [...GROUPS['Dairy shed & barn services (2019 plan)'],'sbtiles','cables','pond','buildings','cowshed','yards','lanes','farminfo','effpit','effdrain','valve'].forEach(k=>state[k]=true); }
  syncLayers(); map.fitBounds([[-46.17135,168.13400],[-46.16790,168.13560]],{paddingTopLeft:[innerWidth>=760?280:10,70],paddingBottomRight:[70,10]}); sgLoad();
} else if(HAZ){
  state={}; LAYERS.forEach(d=>{ if(d.id) state[d.id]=true; }); syncLayers(); fitFarm(); sgLoad(); document.title='GV1 Hazard Map';
  ['viewsBtn','boardBtn','officeBtn'].forEach(i=>{ const e=document.getElementById(i); if(e) e.style.display='none'; });
  { const fb=document.getElementById('farmBtn'); fb.textContent='GV1 Hazard Map'; fb.onclick=null; fb.style.cursor='default'; }
} else if(OFFICE){
  document.body.classList.add('office'); document.title='GV1 Office View';
  state={}; LAYERS.forEach(d=>{ if(d.id) state[d.id]=false; }); ['paddocks','sugg','lanes','buildings','cowshed','yards','trough','farminfo','pond',...GROUPS['Dairy shed & barn services (2019 plan)'],'sbtiles','cables','effpit','effdrain','valve','camera'].forEach(k=>{ if(LAYERS.some(d=>d.id===k)) state[k]=true; });
  { const tg=document.createElement('button'); tg.id='ofToggle'; document.body.appendChild(tg);   // phone: switch between the office panel and the map
    const lab=()=>{ tg.textContent=document.body.classList.contains('mapmode')?'📋 Back to office view':'🗺️ Show map'; };
    tg.onclick=()=>{ document.body.classList.toggle('mapmode'); if(!document.body.classList.contains('mapmode')) closeSheet(); lab(); setTimeout(()=>map.invalidateSize(),60); };
    new MutationObserver(lab).observe(document.body,{attributes:true,attributeFilter:['class']}); lab(); }
  map.invalidateSize(); syncLayers(); fitFarm();
  if(!STAFF.tok) staffSignIn({noClose:true, why:'The office view is for Gladvale staff only. Sign in with your name and code.'});
  else { officeLoad(); setInterval(officeLoad, 10*60*1000); }
  let idle=null; const kick=()=>{ clearTimeout(idle); idle=setTimeout(()=>{ closeSheet(); fitFarm(); const mp=document.getElementById('mtPrompt'); if(mp) mp.remove(); if(OFTAB!=='info' && !window._ckDirty){ OFTAB='info'; try{ localStorage.setItem('gvmap.oftab','info'); }catch(e){} officeRender(); } }, 3*60*1000); };
  ['mousedown','touchstart','wheel','keydown'].forEach(ev=>addEventListener(ev,kick,{passive:true})); kick();
} else if(VIEW==='tiles'){   // website "Tile traffic light map": paddock boundaries + drainage & services + effluent only
  state={}; LAYERS.forEach(d=>{ if(d.id) state[d.id]=false; }); [...GROUPS['Paddocks'],...GROUPS['Drainage & services'],...GROUPS['Effluent']].forEach(k=>state[k]=true);
  syncLayers(); fitFarm(); sgLoad(); document.title='GV1 Tile Traffic Light Map';
} else if(VIEW==='water'){   // website link beside the stock water PDF: paddocks, stock water and the water blocks
  if(!Object.keys(state).length){ LAYERS.forEach(d=>{ if(d.id) state[d.id]=false; });
    ['paddocks','trough','valve','bore',...WL(),'wb0','wb1','wb2','wb3','wb4','wb5','wb6'].forEach(k=>state[k]=true); }
  syncLayers(); fitFarm(); sgLoad(); document.title='GV1 Stock Water Map';
} else { syncLayers(); fitFarm(); sgLoad(); }
let keyPref=null; try{ keyPref=localStorage.getItem('gvmap.key'); }catch(e){}
toggleKey(VIEW==='shed' ? innerWidth>=760 : keyPref===null ? innerWidth>=760 : keyPref==='1');
const hp = new URLSearchParams(location.hash.slice(1)); if(hp.get('p')) selectPaddock(+hp.get('p'));
</script>
